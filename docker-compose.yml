services:
  db:
    image: postgres:16
    container_name: billing_db

    restart: always
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing_dev_pass
      POSTGRES_DB: billing_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: